name: Apply Portable OCC History

on:
  push:
    paths:
      - ".github/workflows/apply-portable-occ-history.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/company-os-outcome-control-plane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Disable already applied CI mutation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_portable_occ_history.py")
          text = path.read_text(encoding="utf-8")
          old = "    patch_ci()\n"
          if text.count(old) != 1:
              raise SystemExit("portable migration CI call did not match exactly once")
          path.write_text(text.replace(old, "", 1), encoding="utf-8")
          PY
      - name: Apply portable historical verification
        run: python3 scripts/apply_portable_occ_history.py
      - name: Verify distribution
        run: python3 scripts/distribution.py verify-manifest
      - name: Verify historical signature without external configuration
        run: python3 scripts/verify_operator_command_center_surface.py
      - name: Verify repository tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify controller
        run: python3 skills/company-os/elastic-company-os/scripts/test_company_os_controller.py
      - name: Verify control store
        run: python3 skills/company-os/elastic-company-os/scripts/test_control_store.py -v
      - name: Verify runtime observations
        run: python3 skills/company-os/elastic-company-os/scripts/test_runtime_observation_integration.py RuntimeObservationIntegrationTests
      - name: Verify operator brief
        run: python3 skills/company-os/elastic-company-os/scripts/test_operator_brief.py -v
      - name: Verify self hosting references
        run: python3 -m unittest discover -s programs/company-os-self-hosting/reference -v
      - name: Verify Luna execution fabric
        run: python3 skills/autonomy-suite/orchestration/luna-execution-fabric/scripts/validate_fabric.py --self-test
      - name: Verify Python compilation
        run: >-
          python3 -m py_compile
          skills/company-os/elastic-company-os/scripts/company_os_controller.py
          skills/company-os/elastic-company-os/scripts/control_store.py
          skills/company-os/elastic-company-os/scripts/runtime_observations.py
          skills/company-os/elastic-company-os/scripts/operator_brief.py
          skills/company-os/elastic-company-os/scripts/outcome_control.py
          programs/company-os-self-hosting/reference/gate2_observation_gateway_contract.py
          scripts/verify_operator_command_center_surface.py
          tests/test_operator_command_center_surface.py
          tests/test_outcome_control.py
      - name: Commit portable verification
        run: |
          rm scripts/apply_portable_occ_history.py
          rm .github/workflows/apply-portable-occ-history.yml
          git config user.name "company-os-portable-verification-bot"
          git config user.email "company-os-portable-verification-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix(company-os): make signed history verification portable"
          git push origin HEAD:codex/company-os-outcome-control-plane
