name: Finalize Provenance Test

on:
  push:
    paths:
      - ".github/workflows/finalize-provenance-test.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/meta-ads-efficiency-feedback
      - name: Align public preflight error taxonomy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_program_preflight_compiler.py')
          text = path.read_text()
          old = '''        expected_codes = {\n            "review_registry": "E_CAPABILITY_BINDING",\n            "source_registry": "E_CAPABILITY_BINDING",\n            "checkout_manifest": "E_BINDING",\n        }\n'''
          new = '''        expected_codes = {\n            "review_registry": "E_BINDING",\n            "source_registry": "E_BINDING",\n            "checkout_manifest": "E_BINDING",\n        }\n'''
          if old not in text:
              raise SystemExit('provenance expectation map not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/finalize-provenance-test.yml
          git config user.name "company-os-test-repair-bot"
          git config user.email "company-os-test-repair-bot@users.noreply.github.com"
          git add tests/test_program_preflight_compiler.py .github/workflows/finalize-provenance-test.yml
          git commit -m "test(company-os): align preflight provenance error taxonomy"
          git push origin HEAD:codex/meta-ads-efficiency-feedback
