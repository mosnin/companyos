name: Apply Outcome Control Integration

on:
  push:
    paths:
      - ".github/workflows/apply-outcome-control-integration.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/company-os-outcome-control-plane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Correct integration marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_outcome_control_integration.py")
          text = path.read_text(encoding="utf-8")
          old = 'marker = "## Project execution\\n"'
          new = 'marker = "## Loop strategy plane\\n"'
          if text.count(old) != 1:
              raise SystemExit("architecture marker patch did not match exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply integration
        run: python3 scripts/apply_outcome_control_integration.py
      - name: Authorize elastic self test fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("skills/autonomy-suite/orchestration/luna-execution-fabric/scripts/validate_fabric.py")
          text = path.read_text(encoding="utf-8")
          old = '    large_manifest["managers"] = []\n'
          new = '''    large_manifest["outcome_control"] = {
              "$schema": "company-os.outcome-control-binding.v1",
              "execution_lane": "production_scale",
              "project_id": "large-self-test",
              "program_version": 1,
              "work_id": "large-self-test-work",
              "governed_outcome": "Produce one accepted artifact",
              "objective_id": "large-self-test-objective",
              "outcome_contract_path": "outcome-contract.json",
              "artifact_contract_path": "artifact-contract.json",
              "evaluator_contract_path": "evaluator-contract.json",
              "benchmark_contract_path": "benchmark-contract.json",
              "calibration_receipts_path": "calibration-receipts.json",
              "scale_authorization_path": "scale-authorization.json",
          }
              large_manifest["managers"] = []
          '''
          if text.count(old) != 1:
              raise SystemExit("large self test insertion did not match exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Verify outcome controls
        run: |
          python3 -m unittest tests.test_outcome_compiler -v
          python3 -m unittest tests.test_outcome_discovery -v
          python3 -m unittest tests.test_artifact_observations -v
          python3 -m unittest tests.test_evaluator_runtime -v
          python3 -m unittest tests.test_outcome_benchmarks -v
          python3 -m unittest tests.test_evaluator_calibration -v
          python3 -m unittest tests.test_reality_acceptance -v
          python3 -m unittest tests.test_outcome_scale_authorization -v
          python3 -m unittest tests.test_outcome_control -v
          python3 skills/autonomy-suite/orchestration/luna-execution-fabric/scripts/validate_fabric.py --self-test
      - name: Verify controller suite
        run: python3 skills/company-os/elastic-company-os/scripts/test_company_os_controller.py
      - name: Regenerate distribution manifest
        run: python3 scripts/distribution.py write-manifest
      - name: Commit integrated product changes
        run: |
          rm scripts/apply_outcome_control_integration.py
          rm .github/workflows/apply-outcome-control-integration.yml
          git config user.name "company-os-outcome-control-bot"
          git config user.email "company-os-outcome-control-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(company-os): enforce outcome control before elastic execution"
          git push origin HEAD:codex/company-os-outcome-control-plane
