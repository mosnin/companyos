name: Finalize Clean Recursive Skill Foundry Tree

on:
  push:
    branches:
      - codex/recursive-skill-foundry
    paths:
      - "artifacts/recursive-skill-foundry/verification.json"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/recursive-skill-foundry
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify accepted evidence before cleanup
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          simulation = json.loads(Path('artifacts/recursive-skill-foundry/simulation-report.json').read_text())
          verification = json.loads(Path('artifacts/recursive-skill-foundry/verification.json').read_text())
          assert simulation['status'] == 'pass', simulation
          assert simulation['summary']['unexpected_failures'] == 0, simulation
          assert simulation['summary']['total_cases'] >= 10, simulation
          assert verification['simulation_status'] == 'pass', verification
          assert verification['full_repository_suite'] == 'pass', verification
          PY
      - name: Install permanent read only foundry workflow
        run: |
          cat > .github/workflows/verify-recursive-skill-foundry.yml <<'YAML'
          name: Verify Recursive Skill Foundry

          on:
            push:
              paths:
                - "skills/company-os/recursive-skill-foundry/**"
                - "skills/company-os/compile-outcome-organization/**"
                - "skills/company-os/company-os/SKILL.md"
                - "skills/company-os/manage-company-program/SKILL.md"
                - "skills/company-os/assign-capability-skills/SKILL.md"
                - "skills/company-os/navigation-control/SKILL.md"
                - "skills/autonomy-suite/execute-bounded-task/SKILL.md"
                - "tests/test_recursive_skill_foundry.py"
                - "tests/test_recursive_skill_foundry_safety.py"
                - "tests/test_recursive_skill_foundry_organization.py"
                - ".github/workflows/verify-recursive-skill-foundry.yml"
            pull_request:
              paths:
                - "skills/company-os/recursive-skill-foundry/**"
                - "skills/company-os/compile-outcome-organization/**"
                - "tests/test_recursive_skill_foundry.py"
                - "tests/test_recursive_skill_foundry_safety.py"
                - "tests/test_recursive_skill_foundry_organization.py"
                - ".github/workflows/verify-recursive-skill-foundry.yml"

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.11"
                - name: Verify role and distribution contracts
                  run: |
                    python3 scripts/validate_role_skills.py
                    python3 scripts/distribution.py verify-manifest
                - name: Verify recursive lifecycle, safety, and automatic assignment
                  run: |
                    python3 -m unittest \
                      tests.test_recursive_skill_foundry \
                      tests.test_recursive_skill_foundry_safety \
                      tests.test_recursive_skill_foundry_organization \
                      tests.test_outcome_organization \
                      tests.test_role_skills \
                      -v
                - name: Run disposable works versus blocks simulation
                  run: |
                    python3 skills/company-os/recursive-skill-foundry/scripts/run_foundry_simulation.py \
                      --output /tmp/recursive-skill-foundry-simulation.json
          YAML
      - name: Remove temporary implementation machinery
        run: |
          rm -f \
            .github/workflows/apply-recursive-skill-foundry.yml \
            .github/workflows/repair-recursive-skill-foundry-phase1.yml \
            .github/workflows/repair-recursive-skill-foundry-phase2.yml \
            .github/workflows/repair-recursive-skill-foundry-phase3.yml \
            .github/workflows/finalize-recursive-skill-foundry.yml \
            .github/workflows/verify-recursive-skill-foundry-phase4.yml \
            .github/workflows/cleanup-recursive-skill-foundry.yml \
            .github/workflows/cleanup-recursive-skill-foundry-v2.yml \
            scripts/apply_recursive_skill_foundry_integration.py \
            scripts/repair_recursive_skill_foundry_phase1.py \
            scripts/repair_recursive_skill_foundry_phase2.py \
            scripts/repair_recursive_skill_foundry_phase3.py \
            scripts/finalize_recursive_skill_foundry.py \
            scripts/finalize_recursive_skill_foundry_v2.py
          python3 scripts/distribution.py write-manifest
          python3 scripts/distribution.py verify-manifest
      - name: Verify clean tree
        run: |
          python3 scripts/validate_role_skills.py
          python3 -m unittest discover -s tests -v
          python3 skills/company-os/recursive-skill-foundry/scripts/run_foundry_simulation.py \
            --output /tmp/final-foundry-simulation.json
          python3 -m py_compile \
            skills/company-os/recursive-skill-foundry/scripts/skill_foundry.py \
            skills/company-os/recursive-skill-foundry/scripts/run_foundry_simulation.py \
            skills/company-os/compile-outcome-organization/scripts/compile_outcome_organization.py
      - name: Write merge readiness receipt
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              '$schema': 'company-os.recursive-skill-foundry-merge-readiness.v1',
              'source_sha': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'focused_suite': 'pass',
              'full_repository_suite': 'pass',
              'simulation': 'pass',
              'temporary_machinery_removed': True,
              'permanent_workflow': '.github/workflows/verify-recursive-skill-foundry.yml',
          }
          Path('artifacts/recursive-skill-foundry/merge-ready.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
      - name: Commit clean merge ready tree
        run: |
          git config user.name "company-os-skill-foundry-bot"
          git config user.email "company-os-skill-foundry-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore(company-os): prepare recursive skill foundry for merge"
          git push origin HEAD:codex/recursive-skill-foundry
