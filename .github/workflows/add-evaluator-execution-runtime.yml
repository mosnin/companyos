name: Add Evaluator Execution Runtime

on:
  push:
    paths:
      - ".github/workflows/add-evaluator-execution-runtime.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/company-os-outcome-control-plane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Materialize evaluator runtime
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payloads = {
              "skills/company-os/execute-outcome-evaluator/scripts/execute_evaluator.py": "",
              "tests/test_evaluator_execution.py": "",
              "skills/company-os/execute-outcome-evaluator/SKILL.md": "",
              "skills/company-os/execute-outcome-evaluator/references/adapter-registry.example.json": "",
              "skills/company-os/execute-outcome-evaluator/references/execution-request.example.json": ""
          }
          for relative, encoded in payloads.items():
              target = Path(relative)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
      - name: Bind execution into evaluator guidance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("skills/company-os/compile-outcome-evaluators/SKILL.md")
          text = path.read_text(encoding="utf-8")
          addition = "\n\nCompiling a contract does not prove execution. Route every required evaluator through `$execute-outcome-evaluator` and retain its verified content addressed execution receipt before calibration, scale authorization, or reality acceptance.\n"
          if addition.strip() not in text:
              path.write_text(text.rstrip() + addition, encoding="utf-8")
          PY
      - name: Verify evaluator execution
        run: python3 -m unittest tests.test_evaluator_execution -v
      - name: Verify repository tests
        run: python3 -m unittest discover -s tests -v
      - name: Regenerate distribution manifest
        run: |
          python3 scripts/distribution.py write-manifest
          python3 scripts/distribution.py verify-manifest
      - name: Commit evaluator execution runtime
        run: |
          rm .github/workflows/add-evaluator-execution-runtime.yml
          git config user.name "company-os-evaluator-runtime-bot"
          git config user.email "company-os-evaluator-runtime-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(company-os): execute evaluators against real artifacts"
          git push origin HEAD:codex/company-os-outcome-control-plane
