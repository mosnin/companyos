name: Apply Execution Enforcement V2 Phase 2

on:
  push:
    paths:
      - ".github/workflows/apply-execution-enforcement-v2-phase2.yml"
      - "scripts/apply_execution_enforcement_v2_phase2.py"
      - "scripts/repair_phase2_and_apply.py"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/execution-enforcement-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply phase 2
        run: python3 scripts/repair_phase2_and_apply.py
      - name: Refresh manifest
        run: python3 scripts/distribution.py write-manifest
      - name: Verify focused changes
        run: |
          python3 -m unittest tests.test_outcome_director tests.test_outcome_organization tests.test_outcome_discovery_bootstrap tests.test_calibration_fabric tests.test_outcome_loop_execution_order -v
          python3 -m py_compile skills/company-os/direct-outcome/scripts/direct_outcome.py skills/company-os/elastic-company-os/scripts/outcome_loop.py skills/company-os/bootstrap-outcome/scripts/bootstrap_outcome.py
      - name: Commit phase 2
        run: |
          git config user.name "company-os-execution-enforcement-bot"
          git config user.email "company-os-execution-enforcement-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(company-os): promote first reality before final scope"
          git push origin HEAD:codex/execution-enforcement-v2
