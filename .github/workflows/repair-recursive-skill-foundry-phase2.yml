name: Repair Recursive Skill Foundry Phase 2

on:
  push:
    branches:
      - codex/recursive-skill-foundry
    paths:
      - ".github/workflows/repair-recursive-skill-foundry-phase2.yml"
      - "scripts/repair_recursive_skill_foundry_phase2.py"
      - "tests/test_recursive_skill_foundry_organization.py"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/recursive-skill-foundry
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply integration and repairs
        run: |
          python3 scripts/apply_recursive_skill_foundry_integration.py
          python3 scripts/repair_recursive_skill_foundry_phase1.py
          python3 scripts/repair_recursive_skill_foundry_phase2.py
      - name: Refresh distribution manifest
        run: python3 scripts/distribution.py write-manifest
      - name: Verify focused behavior
        run: |
          python3 -m py_compile \
            skills/company-os/recursive-skill-foundry/scripts/skill_foundry.py \
            skills/company-os/compile-outcome-organization/scripts/compile_outcome_organization.py
          python3 scripts/validate_role_skills.py
          python3 -m unittest \
            tests.test_recursive_skill_foundry \
            tests.test_recursive_skill_foundry_organization \
            tests.test_outcome_organization \
            tests.test_role_skills \
            -v
          test_root="$(mktemp -d)"
          python3 skills/company-os/recursive-skill-foundry/scripts/skill_foundry.py simulate-foundry \
            --project-root "$test_root" \
            --output "$test_root/simulation.json"
          python3 scripts/distribution.py verify-manifest
      - name: Verify complete repository suite
        run: python3 -m unittest discover -s tests -v
      - name: Commit phase 2
        run: |
          git config user.name "company-os-skill-foundry-bot"
          git config user.email "company-os-skill-foundry-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(company-os): assign verified project skills to outcome workers"
          git push origin HEAD:codex/recursive-skill-foundry
