name: Apply Reality First Execution
on:
  push:
    paths:
      - '.github/workflows/apply-reality-first-execution.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/company-os-outcome-control-plane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply execution governor runtime changes
        run: |
          python3 scripts/apply_execution_governor_integration.py
          python3 scripts/apply_execution_regression_fixes.py
          python3 scripts/apply_execution_manager_policy.py
          python3 scripts/apply_execution_test_compat.py
      - name: Finalize governed tree before validation
        run: |
          rm -f scripts/apply_outcome_handoff_integration.py
          rm -f scripts/apply_execution_governor_integration.py
          rm -f scripts/apply_execution_regression_fixes.py
          rm -f scripts/apply_execution_manager_policy.py
          rm -f scripts/apply_execution_test_compat.py
          rm -f .github/workflows/apply-reality-first-execution.yml
          python3 scripts/distribution.py write-manifest
      - name: Verify focused execution regressions
        run: |
          python3 -m unittest tests.test_outcome_executive_governor tests.test_outcome_loop_execution_order tests.test_outcome_director tests.test_outcome_organization tests.test_outcome_loop tests.test_outcome_discovery_bootstrap tests.test_role_skills tests.test_ui_design_quality -v
      - name: Verify critical runtime syntax
        run: |
          python3 -m py_compile \
            skills/company-os/govern-outcome-execution/scripts/executive_governor.py \
            skills/company-os/direct-outcome/scripts/direct_outcome.py \
            skills/company-os/elastic-company-os/scripts/outcome_loop.py \
            skills/company-os/compile-outcome-organization/scripts/compile_outcome_organization.py \
            skills/company-os/bootstrap-outcome/scripts/bootstrap_outcome.py
      - name: Verify full Company OS test suite
        run: python3 -m unittest discover -s tests -v
      - name: Verify fabric self-test
        run: python3 skills/autonomy-suite/orchestration/luna-execution-fabric/scripts/validate_fabric.py --self-test
      - name: Verify final distribution manifest
        run: python3 scripts/distribution.py verify-manifest
      - name: Commit verified runtime integration
        run: |
          git config user.name 'company-os-execution-governor-bot'
          git config user.email 'company-os-execution-governor-bot@users.noreply.github.com'
          git add -A
          git commit -m 'feat(company-os): make reality execution the critical path'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin codex/company-os-outcome-control-plane
            git rebase origin/codex/company-os-outcome-control-plane
            if git push origin HEAD:codex/company-os-outcome-control-plane; then exit 0; fi
          done
          exit 1
