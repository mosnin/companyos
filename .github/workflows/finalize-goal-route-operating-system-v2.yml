name: Finalize Goal Route Operating System V2

on:
  push:
    branches:
      - codex/goal-route-operating-system
    paths:
      - ".github/workflows/finalize-goal-route-operating-system-v2.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-goal-route-operating-system-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/goal-route-operating-system
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Wait for integration workflows and synchronize
        run: |
          sleep 45
          git fetch origin codex/goal-route-operating-system
          git reset --hard origin/codex/goal-route-operating-system
      - name: Finish integration if staging remains
        run: |
          if [ -f scripts/repair_goal_route_operating_system_v2.py ]; then
            python3 scripts/repair_goal_route_operating_system_v2.py
          elif [ -f scripts/apply_goal_route_operating_system_v2.py ]; then
            python3 scripts/apply_goal_route_operating_system_v2.py
          fi
          rm -f scripts/apply_goal_route_operating_system_v2.py
          rm -f scripts/repair_goal_route_operating_system_v2.py
          rm -f .github/workflows/apply-goal-route-operating-system-v2.yml
          rm -f .github/workflows/repair-goal-route-operating-system-v2.yml
          rm -f .github/workflows/apply-goal-route-operating-system.yml
          rm -rf scripts/goal-route-bundle
          rm -f tmp/goal-route-branch-verification.txt tmp/ignore-this tmp/last-probe tmp/oops tmp/pr-probe.txt tmp/upload-probe-4.txt
      - name: Remove finalization workflow from permanent tree
        run: rm .github/workflows/finalize-goal-route-operating-system-v2.yml
      - name: Refresh distribution manifest
        run: python3 scripts/distribution.py write-manifest
      - name: Verify focused goal route system
        run: |
          python3 -m unittest tests.test_goal_route_system tests.test_goal_route_simulation tests.test_goal_route_organization -v
          python3 skills/company-os/goal-route-system/scripts/goal_route.py simulate
          python3 -m py_compile skills/company-os/goal-route-system/scripts/goal_route.py skills/company-os/direct-outcome/scripts/direct_outcome.py skills/company-os/compile-outcome-organization/scripts/compile_outcome_organization.py skills/company-os/assemble-outcome-candidate/scripts/assemble_candidate.py
      - name: Verify recursive skill foundry
        run: python3 -m unittest discover -s tests -p 'test_recursive_skill_foundry*.py' -v
      - name: Verify complete repository
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/distribution.py verify-manifest
          python3 skills/autonomy-suite/orchestration/luna-execution-fabric/scripts/validate_fabric.py --self-test
      - name: Commit exact verified tree
        run: |
          git config user.name "company-os-goal-route-bot"
          git config user.email "company-os-goal-route-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat(company-os): add goal route operating system"
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin codex/goal-route-operating-system
            git rebase origin/codex/goal-route-operating-system
            if git push origin HEAD:codex/goal-route-operating-system; then exit 0; fi
          done
          exit 1
      - name: Merge verified pull request to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head codex/goal-route-operating-system --base main --state open --json number --jq '.[0].number')
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --head codex/goal-route-operating-system --base main --title "feat(company-os): add goal route operating system" --body "Concrete recursive goals, route planning, sprints, agent templates, cohesion, evidence progress, rerouting, takeover, and worker goal assignments."
            PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head codex/goal-route-operating-system --base main --state open --json number --jq '.[0].number')
          fi
          gh pr ready "$PR" --repo "$GITHUB_REPOSITORY" || true
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --subject "feat(company-os): add goal route operating system" --body "Verified recursive goal and route execution control." 
