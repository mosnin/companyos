name: Autonomous Agent OS Micro Test

on:
  push:
    branches:
      - test/agent-os-autonomous-micro-20260811
    paths:
      - ".github/workflows/agent-os-autonomous-micro.yml"
      - "tests/agent_os_autonomous_micro/**"
      - "skills/company-os/**"
      - "skills/autonomy-suite/**"
      - "scripts/distribution.py"

permissions:
  contents: read

jobs:
  autonomous-micro:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WORKSPACE: ${{ github.workspace }}/agent-os-micro-workspace
      AGENT_MODEL: qwen2.5-coder:3b
      OLLAMA_URL: http://127.0.0.1:11434
      MAX_AGENT_TURNS: "16"
      MAX_MISSION_CYCLES: "12"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/agent-os-autonomous-micro-20260811
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify local runtime syntax
        run: python3 -m py_compile tests/agent_os_autonomous_micro/local_agent_runtime.py tests/agent_os_autonomous_micro/evaluate.py

      - name: Install independent browser evaluator
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install chromium --with-deps

      - name: Start local model provider
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          OLLAMA_HOST=127.0.0.1:11434 OLLAMA_CONTEXT_LENGTH=16384 OLLAMA_NUM_PARALLEL=1 nohup ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$AGENT_MODEL"

      - name: Prepare isolated Company OS workspace
        run: |
          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE/.company-os-test"
          cp tests/agent_os_autonomous_micro/OBJECTIVE.md "$WORKSPACE/OBJECTIVE.md"
          cp tests/agent_os_autonomous_micro/WORKSPACE_AGENTS.md "$WORKSPACE/AGENTS.md"
          python3 scripts/distribution.py install --target "$WORKSPACE/.codex/skills"
          git -C "$WORKSPACE" init -q
          git -C "$WORKSPACE" config user.name "Agent OS Autonomous Test"
          git -C "$WORKSPACE" config user.email "agent-os-test@example.invalid"
          git -C "$WORKSPACE" add -A
          git -C "$WORKSPACE" commit -q -m "test baseline"

      - name: Run Company OS without human steering
        run: |
          set -o pipefail
          python3 tests/agent_os_autonomous_micro/local_agent_runtime.py \
            --workspace "$WORKSPACE" \
            --objective-file "$WORKSPACE/OBJECTIVE.md" \
            --model "$AGENT_MODEL" \
            2>&1 | tee "$WORKSPACE/.company-os-test/local-agent-runtime.log"

      - name: Preserve autonomous execution metadata
        if: always()
        run: |
          mkdir -p "$WORKSPACE/.company-os-test"
          git -C "$WORKSPACE" status --short > "$WORKSPACE/.company-os-test/git-status.txt" || true
          git -C "$WORKSPACE" log --oneline --decorate --all > "$WORKSPACE/.company-os-test/git-log.txt" || true
          find "$WORKSPACE" -maxdepth 10 -type f -not -path '*/.git/*' | sort > "$WORKSPACE/.company-os-test/file-inventory.txt" || true
          cp /tmp/ollama.log "$WORKSPACE/.company-os-test/ollama.log" || true

      - name: Independently evaluate Company OS and product reality
        if: always()
        run: |
          python3 tests/agent_os_autonomous_micro/evaluate.py \
            --workspace "$WORKSPACE" \
            --report "$GITHUB_WORKSPACE/agent-os-autonomous-micro-report.json"

      - name: Upload complete autonomous evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-os-autonomous-micro-evidence
          path: |
            agent-os-autonomous-micro-report.json
            agent-os-micro-workspace
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
