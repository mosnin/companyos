name: Patch Portability Expectations

on:
  push:
    paths:
      - ".github/workflows/patch-portability-expectations.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/meta-ads-efficiency-feedback
      - name: Align tests with portable provenance semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test_capability_review_registry.py')
          text = path.read_text()
          old = 'for field, code in (("source_commit", "E_BINDING"), ("source_tree", "E_BINDING"), ("checkout_path", "E_PATH")):'
          new = 'for field, code in (("source_commit", "E_CHECKOUT"), ("source_tree", "E_CHECKOUT"), ("checkout_path", "E_PATH")):'
          if old not in text:
              raise SystemExit('tamper expectation tuple not found')
          text = text.replace(old, new, 1)
          old = '"checkout_manifest_sha256": MODULE.canonical_digest(json.loads(MANIFEST_PATH.read_text())),'
          new = '"checkout_manifest_sha256": MODULE._manifest_digest(json.loads(MANIFEST_PATH.read_text())),'
          if old not in text:
              raise SystemExit('acceptance checkout digest not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('tests/test_program_preflight_compiler.py')
          text = path.read_text()
          old = 'self.assertEqual("E_BINDING", caught.exception.code)'
          if old not in text:
              raise SystemExit('preflight binding expectation not found')
          text = text.replace(old, 'self.assertEqual("E_CAPABILITY_BINDING", caught.exception.code)', 1)
          path.write_text(text)
          PY
          rm .github/workflows/patch-portability-expectations.yml
          git config user.name "company-os-test-portability-bot"
          git config user.email "company-os-test-portability-bot@users.noreply.github.com"
          git add tests/test_capability_review_registry.py tests/test_program_preflight_compiler.py .github/workflows/patch-portability-expectations.yml
          git commit -m "test(company-os): align portable provenance expectations"
          git push origin HEAD:codex/meta-ads-efficiency-feedback
