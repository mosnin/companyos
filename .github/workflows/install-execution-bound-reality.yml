name: Install Execution Bound Reality Acceptance

on:
  push:
    paths:
      - ".github/workflows/install-execution-bound-reality.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/company-os-outcome-control-plane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install execution bound reality acceptance
        run: |
          set -euo pipefail
          tar -xzf .company-os-tmp/execution-bound-reality.tar.gz
          python3 .company-os-tmp/patch_outcome_control_reality.py
          rm .company-os-tmp/execution-bound-reality.tar.gz
          rm .company-os-tmp/patch_outcome_control_reality.py
          rmdir .company-os-tmp
          rm .github/workflows/install-execution-bound-reality.yml
      - name: Verify reality acceptance
        run: |
          python3 -m unittest tests.test_reality_acceptance -v
          python3 -m unittest tests.test_outcome_control -v
          python3 -m py_compile skills/company-os/accept-outcome-reality/scripts/accept_reality.py
      - name: Regenerate distribution manifest
        run: |
          python3 scripts/distribution.py write-manifest
          python3 scripts/distribution.py verify-manifest
      - name: Verify repository tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify controller integration
        run: python3 skills/company-os/elastic-company-os/scripts/test_company_os_controller.py
      - name: Commit execution bound reality acceptance
        run: |
          git config user.name "company-os-reality-runtime-bot"
          git config user.email "company-os-reality-runtime-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(company-os): verify reality from evaluator executions"
          git push origin HEAD:codex/company-os-outcome-control-plane
