name: Apply Runtime Artifact Bindings

on:
  push:
    paths:
      - ".github/workflows/apply-runtime-artifact-bindings.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/company-os-outcome-control-plane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply runtime artifact bindings
        run: python3 scripts/apply_runtime_artifact_bindings.py
      - name: Verify native runtime artifact receipts
        run: python3 skills/company-os/elastic-company-os/scripts/test_native_task_runtime.py -v
      - name: Refresh distribution manifest
        run: python3 scripts/distribution.py write-manifest
      - name: Verify repository suite
        run: python3 -m unittest discover -s tests -v
      - name: Verify controller suite
        run: python3 skills/company-os/elastic-company-os/scripts/test_company_os_controller.py
      - name: Verify runtime observations
        run: python3 skills/company-os/elastic-company-os/scripts/test_runtime_observation_integration.py RuntimeObservationIntegrationTests
      - name: Verify Python compilation
        run: python3 -m py_compile skills/company-os/elastic-company-os/scripts/native_task_runtime.py skills/company-os/elastic-company-os/scripts/test_native_task_runtime.py
      - name: Commit verified runtime artifact bindings
        run: |
          rm scripts/apply_runtime_artifact_bindings.py
          rm .github/workflows/apply-runtime-artifact-bindings.yml
          git config user.name "company-os-runtime-artifact-bot"
          git config user.email "company-os-runtime-artifact-bot@users.noreply.github.com"
          git add skills distribution-manifest.json scripts .github/workflows
          git commit -m "feat(company-os): bind runtime artifacts to outcome classes"
          git pull --rebase origin codex/company-os-outcome-control-plane
          git push origin HEAD:codex/company-os-outcome-control-plane
