name: Verify Outcome Director

on:
  push:
    paths:
      - ".github/workflows/verify-outcome-director.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/company-os-outcome-control-plane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify focused autonomous outcome system
        run: >-
          python3 -m unittest
          tests.test_outcome_director
          tests.test_calibration_fabric
          tests.test_outcome_stack
          tests.test_evaluator_registry
          tests.test_evaluator_build_fabric
          tests.test_outcome_discovery_bootstrap
          tests.test_outcome_organization
          tests.test_outcome_scale_authorization
          tests.test_reality_acceptance
          tests.test_outcome_loop
          tests.test_outcome_control
          -v
      - name: Refresh distribution manifest
        run: python3 scripts/distribution.py write-manifest
      - name: Verify repository suite
        run: python3 -m unittest discover -s tests -v
      - name: Verify controller suite
        run: python3 skills/company-os/elastic-company-os/scripts/test_company_os_controller.py
      - name: Verify control store
        run: python3 skills/company-os/elastic-company-os/scripts/test_control_store.py -v
      - name: Verify runtime observations
        run: python3 skills/company-os/elastic-company-os/scripts/test_runtime_observation_integration.py RuntimeObservationIntegrationTests
      - name: Verify operator brief
        run: python3 skills/company-os/elastic-company-os/scripts/test_operator_brief.py -v
      - name: Verify fabric validator
        run: python3 skills/autonomy-suite/orchestration/luna-execution-fabric/scripts/validate_fabric.py --self-test
      - name: Verify Python compilation
        run: >-
          python3 -m py_compile
          skills/company-os/direct-outcome/scripts/direct_outcome.py
          skills/company-os/calibrate-outcome-stack/scripts/compile_calibration_fabric.py
          skills/company-os/materialize-outcome-stack/scripts/materialize_outcome_stack.py
          skills/company-os/register-outcome-evaluators/scripts/register_outcome_evaluators.py
          skills/company-os/build-outcome-evaluators/scripts/compile_evaluator_build_fabric.py
          skills/company-os/bootstrap-outcome/scripts/bootstrap_outcome.py
          skills/company-os/synthesize-outcome-model/scripts/synthesize_outcome_model.py
          skills/company-os/compile-outcome-organization/scripts/compile_outcome_organization.py
          skills/company-os/elastic-company-os/scripts/outcome_loop.py
          skills/company-os/accept-outcome-reality/scripts/accept_reality.py
      - name: Commit verified director distribution
        run: |
          git config user.name "company-os-outcome-director-bot"
          git config user.email "company-os-outcome-director-bot@users.noreply.github.com"
          git add distribution-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(company-os): refresh autonomous outcome distribution"
            git fetch origin codex/company-os-outcome-control-plane
            git rebase origin/codex/company-os-outcome-control-plane
            python3 scripts/distribution.py write-manifest
            git add distribution-manifest.json
            git commit --amend --no-edit
            git push origin HEAD:codex/company-os-outcome-control-plane
          fi
