name: Verify Outcome Runtime Bridge

on:
  push:
    paths:
      - ".github/workflows/verify-outcome-runtime-bridge.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/company-os-outcome-control-plane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify candidate receipt bridge
        run: python3 -m unittest tests.test_outcome_runtime_bridge -v
      - name: Refresh distribution manifest
        run: python3 scripts/distribution.py write-manifest
      - name: Commit verified bridge manifest
        run: |
          rm .github/workflows/verify-outcome-runtime-bridge.yml
          git config user.name "company-os-outcome-bridge-bot"
          git config user.email "company-os-outcome-bridge-bot@users.noreply.github.com"
          git add distribution-manifest.json .github/workflows
          git commit -m "chore(company-os): seal outcome runtime bridge"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin codex/company-os-outcome-control-plane
            git rebase origin/codex/company-os-outcome-control-plane
            if git push origin HEAD:codex/company-os-outcome-control-plane; then
              exit 0
            fi
          done
          exit 1
