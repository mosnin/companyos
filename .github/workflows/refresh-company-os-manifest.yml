name: Refresh Company OS Manifest

on:
  push:
    branches:
      - codex/meta-ads-efficiency-feedback
    paths:
      - .github/workflows/refresh-company-os-manifest.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/meta-ads-efficiency-feedback
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate manifest and remove one-shot workflow
        run: |
          python3 scripts/distribution.py write-manifest
          rm .github/workflows/refresh-company-os-manifest.yml
          git config user.name "company-os-manifest-bot"
          git config user.email "company-os-manifest-bot@users.noreply.github.com"
          git add distribution-manifest.json .github/workflows/refresh-company-os-manifest.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(company-os): refresh distribution manifest"
          git push origin HEAD:codex/meta-ads-efficiency-feedback
