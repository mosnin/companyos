name: Verify Outcome Discovery

on:
  push:
    paths:
      - ".github/workflows/verify-outcome-discovery.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/company-os-outcome-control-plane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify autonomous discovery
        run: python3 -m unittest tests.test_outcome_discovery_bootstrap tests.test_outcome_loop tests.test_outcome_scale_authorization tests.test_reality_acceptance -v
      - name: Verify fabric
        run: python3 skills/autonomy-suite/orchestration/luna-execution-fabric/scripts/validate_fabric.py --self-test
      - name: Refresh distribution manifest
        run: python3 scripts/distribution.py write-manifest
      - name: Verify repository suite
        run: python3 -m unittest discover -s tests -v
      - name: Verify controller suite
        run: python3 skills/company-os/elastic-company-os/scripts/test_company_os_controller.py
      - name: Verify Python compilation
        run: >-
          python3 -m py_compile
          skills/company-os/bootstrap-outcome/scripts/bootstrap_outcome.py
          skills/company-os/synthesize-outcome-model/scripts/synthesize_outcome_model.py
          tests/test_outcome_discovery_bootstrap.py
      - name: Commit refreshed distribution
        run: |
          git config user.name "company-os-discovery-bootstrap-bot"
          git config user.email "company-os-discovery-bootstrap-bot@users.noreply.github.com"
          git add distribution-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(company-os): refresh discovery distribution"
            git push origin HEAD:codex/company-os-outcome-control-plane
          fi
