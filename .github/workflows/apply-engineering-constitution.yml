name: Apply Engineering Constitution
on:
  push:
    paths:
      - '.github/workflows/apply-engineering-constitution.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/company-os-outcome-control-plane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply recursive engineering integration
        run: python3 scripts/apply_engineering_constitution_integration.py
      - name: Verify engineering constitution
        run: python3 -m unittest tests.test_engineering_execution_contract tests.test_outcome_organization -v
      - name: Verify Python
        run: python3 -m py_compile skills/company-os/engineering-execution-constitution/scripts/engineering_contract.py skills/company-os/compile-outcome-organization/scripts/compile_outcome_organization.py
      - name: Refresh manifest
        run: python3 scripts/distribution.py write-manifest
      - name: Commit verified constitution
        run: |
          rm scripts/apply_engineering_constitution_integration.py
          rm .github/workflows/apply-engineering-constitution.yml
          git config user.name 'company-os-engineering-constitution-bot'
          git config user.email 'company-os-engineering-constitution-bot@users.noreply.github.com'
          git add skills tests distribution-manifest.json scripts .github/workflows
          git commit -m 'feat(company-os): enforce engineering constitution recursively'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin codex/company-os-outcome-control-plane
            git rebase origin/codex/company-os-outcome-control-plane
            if git push origin HEAD:codex/company-os-outcome-control-plane; then exit 0; fi
          done
          exit 1
