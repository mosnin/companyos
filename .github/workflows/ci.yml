name: Company OS Core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/distribution.py verify-manifest
      - run: python3 -m unittest discover -s tests -v
      - run: python3 skills/company-os/elastic-company-os/scripts/test_company_os_controller.py
      - run: python3 skills/company-os/elastic-company-os/scripts/test_control_store.py -v
      - run: python3 skills/company-os/elastic-company-os/scripts/test_runtime_observation_integration.py RuntimeObservationIntegrationTests
      - run: python3 -m unittest discover -s programs/company-os-self-hosting/reference -v
      - run: python3 skills/autonomy-suite/orchestration/luna-execution-fabric/scripts/validate_fabric.py --self-test
      - run: python3 -m py_compile skills/company-os/elastic-company-os/scripts/company_os_controller.py skills/company-os/elastic-company-os/scripts/control_store.py skills/company-os/elastic-company-os/scripts/runtime_observations.py skills/company-os/elastic-company-os/scripts/test_company_os_controller.py skills/company-os/elastic-company-os/scripts/test_control_store.py skills/company-os/elastic-company-os/scripts/test_runtime_observation_integration.py programs/company-os-self-hosting/reference/gate2_observation_gateway_contract.py programs/company-os-self-hosting/reference/test_gate2_observation_gateway_contract.py scripts/distribution.py tests/test_distribution.py
