name: Patch Portable Test Paths

on:
  push:
    paths:
      - ".github/workflows/patch-portable-test-paths.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/meta-ads-efficiency-feedback
      - name: Replace workstation manifest paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test_capability_catalog.py')
          text = path.read_text()
          text = text.replace('ensure_capability_review_checkouts()\nSKILL_ROOT', 'SKILL_ROOT', 1)
          old = 'CHECKOUT_MANIFEST_PATH = Path("/Users/preston/Documents/Codex/2026-08-05/company-os-all-repos-depth/evidence/master/capability-review-checkouts.v1.json")'
          if old not in text:
              raise SystemExit('catalog legacy manifest path not found')
          text = text.replace(old, 'CHECKOUT_MANIFEST_PATH = ensure_capability_review_checkouts()', 1)
          path.write_text(text)

          path = Path('tests/test_capability_review_registry.py')
          text = path.read_text()
          text = text.replace('ensure_capability_review_checkouts()\nSKILL_ROOT', 'SKILL_ROOT', 1)
          old = 'MANIFEST_PATH = Path("/Users/preston/Documents/Codex/2026-08-05/company-os-all-repos-depth/evidence/master/capability-review-checkouts.v1.json")'
          if old not in text:
              raise SystemExit('review registry legacy manifest path not found')
          text = text.replace(old, 'MANIFEST_PATH = ensure_capability_review_checkouts()', 1)
          path.write_text(text)

          path = Path('tests/test_program_preflight_compiler.py')
          text = path.read_text()
          text = text.replace('ensure_capability_review_checkouts()\nMODULE_PATH', 'MODULE_PATH', 1)
          old = '''        checkout_manifest = (\n            ROOT.parent\n            / "2026-08-05/company-os-all-repos-depth/evidence/master/capability-review-checkouts.v1.json"\n        )'''
          if old not in text:
              raise SystemExit('preflight legacy manifest path not found')
          text = text.replace(old, '        checkout_manifest = ensure_capability_review_checkouts()', 1)
          path.write_text(text)
          PY
          rm .github/workflows/patch-portable-test-paths.yml
          git config user.name "company-os-test-portability-bot"
          git config user.email "company-os-test-portability-bot@users.noreply.github.com"
          git add tests/test_capability_catalog.py tests/test_capability_review_registry.py tests/test_program_preflight_compiler.py .github/workflows/patch-portable-test-paths.yml
          git commit -m "test(company-os): remove workstation review manifest paths"
          git push origin HEAD:codex/meta-ads-efficiency-feedback
