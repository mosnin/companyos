name: Finalize Recursive Skill Foundry

on:
  push:
    branches:
      - codex/recursive-skill-foundry
    paths:
      - ".github/workflows/finalize-recursive-skill-foundry.yml"
      - "scripts/finalize_recursive_skill_foundry_v2.py"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/recursive-skill-foundry
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply final integration
        run: |
          python3 scripts/apply_recursive_skill_foundry_integration.py
          python3 scripts/finalize_recursive_skill_foundry_v2.py
      - name: Refresh distribution manifest
        run: python3 scripts/distribution.py write-manifest
      - name: Verify source and role contracts
        run: |
          python3 -m py_compile \
            skills/company-os/recursive-skill-foundry/scripts/skill_foundry.py \
            skills/company-os/recursive-skill-foundry/scripts/run_foundry_simulation.py \
            skills/company-os/compile-outcome-organization/scripts/compile_outcome_organization.py
          python3 scripts/validate_role_skills.py
          python3 scripts/distribution.py verify-manifest
      - name: Verify foundry and seamless assignment
        run: |
          python3 -m unittest \
            tests.test_recursive_skill_foundry \
            tests.test_recursive_skill_foundry_organization \
            tests.test_outcome_organization \
            tests.test_role_skills \
            -v
      - name: Produce works versus blocks evidence
        run: |
          mkdir -p artifacts/recursive-skill-foundry
          python3 skills/company-os/recursive-skill-foundry/scripts/run_foundry_simulation.py \
            --output artifacts/recursive-skill-foundry/simulation-report.json
      - name: Verify complete repository suite
        run: python3 -m unittest discover -s tests -v
      - name: Commit verified final state
        run: |
          git config user.name "company-os-skill-foundry-bot"
          git config user.email "company-os-skill-foundry-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(company-os): finalize recursive reusable skill foundry"
          git push origin HEAD:codex/recursive-skill-foundry
