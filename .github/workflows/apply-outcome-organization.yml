name: Apply Outcome Organization

on:
  push:
    paths:
      - ".github/workflows/apply-outcome-organization.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/company-os-outcome-control-plane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply organization enforcement
        run: python3 scripts/apply_outcome_organization_integration.py
      - name: Verify focused organization behavior
        run: python3 -m unittest tests.test_outcome_organization tests.test_outcome_loop tests.test_outcome_control -v
      - name: Verify fabric validator
        run: python3 skills/autonomy-suite/orchestration/luna-execution-fabric/scripts/validate_fabric.py --self-test
      - name: Refresh distribution manifest
        run: python3 scripts/distribution.py write-manifest
      - name: Verify repository suite
        run: python3 -m unittest discover -s tests -v
      - name: Verify controller suite
        run: python3 skills/company-os/elastic-company-os/scripts/test_company_os_controller.py
      - name: Verify control store
        run: python3 skills/company-os/elastic-company-os/scripts/test_control_store.py -v
      - name: Verify runtime observations
        run: python3 skills/company-os/elastic-company-os/scripts/test_runtime_observation_integration.py RuntimeObservationIntegrationTests
      - name: Verify Python compilation
        run: >-
          python3 -m py_compile
          skills/company-os/compile-outcome-organization/scripts/compile_outcome_organization.py
          skills/company-os/elastic-company-os/scripts/outcome_loop.py
          skills/company-os/elastic-company-os/scripts/outcome_control.py
          skills/company-os/elastic-company-os/scripts/company_os_controller.py
          skills/autonomy-suite/orchestration/luna-execution-fabric/scripts/validate_fabric.py
          tests/test_outcome_organization.py
      - name: Commit verified organization enforcement
        run: |
          rm scripts/apply_outcome_organization_integration.py
          git config user.name "company-os-outcome-organization-bot"
          git config user.email "company-os-outcome-organization-bot@users.noreply.github.com"
          git add skills tests distribution-manifest.json scripts
          git commit -m "feat(company-os): bind execution organization to outcome bottlenecks"
          git push origin HEAD:codex/company-os-outcome-control-plane
