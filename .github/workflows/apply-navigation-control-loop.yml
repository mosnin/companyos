name: Apply Navigation Control Loop

on:
  push:
    branches:
      - codex/navigation-control-loop
    paths:
      - ".github/workflows/apply-navigation-control-loop.yml"
      - "scripts/apply_navigation_control_loop.py"
      - "skills/company-os/navigation-control/**"
      - "tests/test_navigation_control.py"
      - "tests/test_navigation_mission_integration.py"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/navigation-control-loop
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply navigation integration
        run: python3 scripts/apply_navigation_control_loop.py
      - name: Refresh distribution manifest
        run: python3 scripts/distribution.py write-manifest
      - name: Verify navigation control
        run: |
          python3 -m unittest tests.test_navigation_control tests.test_navigation_mission_integration -v
          python3 -m py_compile skills/company-os/navigation-control/scripts/navigation_control.py skills/company-os/mission-execution-control/scripts/mission_control.py skills/company-os/direct-outcome/scripts/direct_outcome.py skills/company-os/compile-outcome-organization/scripts/compile_outcome_organization.py
      - name: Verify full Company OS
        run: |
          python3 -m unittest discover -s tests -v
          python3 skills/company-os/mission-execution-control/scripts/execution_regression_lab.py --json
          python3 skills/company-os/elastic-company-os/scripts/test_company_os_controller.py
          python3 skills/company-os/elastic-company-os/scripts/test_control_store.py -v
          python3 skills/company-os/elastic-company-os/scripts/test_runtime_observation_integration.py RuntimeObservationIntegrationTests
          python3 skills/autonomy-suite/orchestration/luna-execution-fabric/scripts/validate_fabric.py --self-test
          python3 scripts/distribution.py verify-manifest
      - name: Commit integrated runtime
        run: |
          git config user.name "company-os-navigation-bot"
          git config user.email "company-os-navigation-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(company-os): navigate objectives through closed-loop action"
          git push origin HEAD:codex/navigation-control-loop
