name: Apply Execution Enforcement V2 Phase 5

on:
  push:
    paths:
      - ".github/workflows/apply-execution-enforcement-v2-phase5.yml"
      - "scripts/apply_execution_enforcement_v2_phase5.py"
      - "scripts/repair_phase5_and_apply.py"
      - "tests/test_discovery_mission_binding.py"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/execution-enforcement-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply phase 5
        run: python3 scripts/repair_phase5_and_apply.py
      - name: Refresh manifest
        run: python3 scripts/distribution.py write-manifest
      - name: Verify focused changes
        run: |
          python3 -m unittest tests.test_discovery_mission_binding tests.test_outcome_director tests.test_mission_execution_control tests.test_outcome_organization -v
          python3 -m py_compile skills/company-os/direct-outcome/scripts/direct_outcome.py
      - name: Commit phase 5
        run: |
          git config user.name "company-os-execution-enforcement-bot"
          git config user.email "company-os-execution-enforcement-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(company-os): bind discovery execution to mission control"
          git push origin HEAD:codex/execution-enforcement-v2
