name: Apply Execution Enforcement V2 Retry

on:
  push:
    paths:
      - ".github/workflows/apply-execution-enforcement-v2-retry.yml"
      - "scripts/repair_apply_execution_v2.py"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/execution-enforcement-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply controller integration
        run: python3 scripts/repair_apply_execution_v2.py
      - name: Refresh distribution manifest
        run: python3 scripts/distribution.py write-manifest
      - name: Verify focused execution enforcement
        run: |
          python3 -m unittest tests.test_mission_execution_control tests.test_product_checkpoint -v
          python3 -m py_compile skills/company-os/mission-execution-control/scripts/mission_control.py skills/company-os/mission-execution-control/scripts/checkpoint_product.py
      - name: Commit integration checkpoint
        run: |
          git config user.name "company-os-execution-enforcement-bot"
          git config user.email "company-os-execution-enforcement-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(company-os): integrate mission execution control"
          git push origin HEAD:codex/execution-enforcement-v2
