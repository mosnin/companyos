name: Apply Execution Enforcement V2 Phase 6

on:
  push:
    paths:
      - ".github/workflows/apply-execution-enforcement-v2-phase6.yml"
      - "scripts/apply_execution_enforcement_v2_phase6.py"
      - "tests/test_director_product_checkpoint.py"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/execution-enforcement-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply phase 6
        run: python3 scripts/apply_execution_enforcement_v2_phase6.py
      - name: Refresh manifest
        run: python3 scripts/distribution.py write-manifest
      - name: Verify focused changes
        run: |
          python3 -m unittest tests.test_director_product_checkpoint tests.test_product_checkpoint tests.test_execution_enforcement_regression_lab tests.test_mission_execution_control tests.test_role_skills tests.test_ui_design_quality -v
          python3 -m py_compile skills/company-os/mission-execution-control/scripts/checkpoint_product.py skills/company-os/direct-outcome/scripts/direct_outcome.py
      - name: Commit phase 6
        run: |
          git config user.name "company-os-execution-enforcement-bot"
          git config user.email "company-os-execution-enforcement-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(company-os): checkpoint every real product candidate"
          git push origin HEAD:codex/execution-enforcement-v2
