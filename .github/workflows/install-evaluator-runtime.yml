name: Install Evaluator Runtime

on:
  push:
    paths:
      - ".github/workflows/install-evaluator-runtime.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/company-os-outcome-control-plane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install content addressed evaluator runtime
        run: |
          set -euo pipefail
          tar -xzf .company-os-tmp/evaluator-runtime.tar.gz
          python3 - <<'PY'
          from pathlib import Path
          path = Path("skills/company-os/compile-outcome-evaluators/SKILL.md")
          text = path.read_text(encoding="utf-8").rstrip()
          addition = "Compiling a contract does not prove execution. Route every required evaluator through `$execute-outcome-evaluator` and retain its verified content addressed execution receipt before calibration, scale authorization, or reality acceptance."
          if addition not in text:
              text += "\n\n" + addition
          path.write_text(text + "\n", encoding="utf-8")
          PY
          rm .company-os-tmp/evaluator-runtime.tar.gz
          rmdir .company-os-tmp
          rm .github/workflows/install-evaluator-runtime.yml
      - name: Verify evaluator execution
        run: |
          python3 -m unittest tests.test_evaluator_execution -v
          python3 -m py_compile skills/company-os/execute-outcome-evaluator/scripts/execute_evaluator.py
      - name: Verify repository tests
        run: python3 -m unittest discover -s tests -v
      - name: Regenerate distribution manifest
        run: |
          python3 scripts/distribution.py write-manifest
          python3 scripts/distribution.py verify-manifest
      - name: Commit evaluator execution runtime
        run: |
          git config user.name "company-os-evaluator-runtime-bot"
          git config user.email "company-os-evaluator-runtime-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(company-os): execute evaluators against real artifacts"
          git push origin HEAD:codex/company-os-outcome-control-plane
