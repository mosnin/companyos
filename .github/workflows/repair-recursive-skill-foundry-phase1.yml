name: Repair Recursive Skill Foundry Phase 1

on:
  push:
    branches:
      - codex/recursive-skill-foundry
    paths:
      - ".github/workflows/repair-recursive-skill-foundry-phase1.yml"
      - "scripts/repair_recursive_skill_foundry_phase1.py"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/recursive-skill-foundry
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply repair
        run: python3 scripts/repair_recursive_skill_foundry_phase1.py
      - name: Refresh and verify
        run: |
          python3 scripts/distribution.py write-manifest
          python3 -m unittest tests.test_recursive_skill_foundry -v
          python3 scripts/validate_role_skills.py
          python3 scripts/distribution.py verify-manifest
      - name: Commit repair
        run: |
          git config user.name "company-os-skill-foundry-bot"
          git config user.email "company-os-skill-foundry-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix(company-os): bind recursive coordinator before manifest mutation"
          git push origin HEAD:codex/recursive-skill-foundry
