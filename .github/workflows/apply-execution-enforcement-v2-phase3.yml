name: Apply Execution Enforcement V2 Phase 3

on:
  push:
    paths:
      - ".github/workflows/apply-execution-enforcement-v2-phase3.yml"
      - "scripts/apply_execution_enforcement_v2_phase3.py"
      - "tests/test_reality_spike_ingestion.py"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/execution-enforcement-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply phase 3
        run: python3 scripts/apply_execution_enforcement_v2_phase3.py
      - name: Refresh manifest
        run: python3 scripts/distribution.py write-manifest
      - name: Verify focused changes
        run: |
          python3 -m unittest tests.test_reality_spike_ingestion tests.test_mission_execution_control tests.test_outcome_director tests.test_outcome_discovery_bootstrap -v
          python3 -m py_compile skills/company-os/mission-execution-control/scripts/mission_control.py skills/company-os/direct-outcome/scripts/direct_outcome.py skills/company-os/bootstrap-outcome/scripts/bootstrap_outcome.py
      - name: Commit phase 3
        run: |
          git config user.name "company-os-execution-enforcement-bot"
          git config user.email "company-os-execution-enforcement-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(company-os): ingest reality spikes and lease scheduler wakes"
          git push origin HEAD:codex/execution-enforcement-v2
