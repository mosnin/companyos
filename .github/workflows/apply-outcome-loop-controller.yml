name: Apply Outcome Loop Controller

on:
  push:
    paths:
      - ".github/workflows/apply-outcome-loop-controller.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/company-os-outcome-control-plane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply controller integration
        run: python3 scripts/apply_outcome_loop_controller_integration.py
      - name: Verify focused outcome loop
        run: python3 -m unittest tests.test_outcome_loop tests.test_reality_acceptance tests.test_outcome_control -v
      - name: Refresh distribution manifest
        run: python3 scripts/distribution.py write-manifest
      - name: Verify repository suite
        run: python3 -m unittest discover -s tests -v
      - name: Verify controller suite
        run: python3 skills/company-os/elastic-company-os/scripts/test_company_os_controller.py
      - name: Verify control store
        run: python3 skills/company-os/elastic-company-os/scripts/test_control_store.py -v
      - name: Verify runtime observations
        run: python3 skills/company-os/elastic-company-os/scripts/test_runtime_observation_integration.py RuntimeObservationIntegrationTests
      - name: Verify operator brief
        run: python3 skills/company-os/elastic-company-os/scripts/test_operator_brief.py -v
      - name: Verify Python compilation
        run: >-
          python3 -m py_compile
          skills/company-os/elastic-company-os/scripts/outcome_loop.py
          skills/company-os/elastic-company-os/scripts/outcome_control.py
          skills/company-os/accept-outcome-reality/scripts/accept_reality.py
          skills/company-os/elastic-company-os/scripts/company_os_controller.py
          tests/test_outcome_loop.py
          tests/test_reality_acceptance.py
          tests/test_outcome_control.py
      - name: Commit verified integration
        run: |
          rm scripts/apply_outcome_loop_controller_integration.py
          rm -f .company-os-tmp/execution-bound-reality.tar.gz .company-os-tmp/patch_outcome_control_reality.py
          git config user.name "company-os-outcome-loop-bot"
          git config user.email "company-os-outcome-loop-bot@users.noreply.github.com"
          git add skills tests distribution-manifest.json scripts .company-os-tmp
          git commit -m "feat(company-os): enforce closed loop reality acceptance"
          git push origin HEAD:codex/company-os-outcome-control-plane
