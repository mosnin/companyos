name: Apply Outcome Evaluator Organization

on:
  push:
    paths:
      - ".github/workflows/apply-outcome-evaluator-organization.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/company-os-outcome-control-plane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply evaluator organization support
        run: |
          python3 scripts/apply_outcome_evaluator_organization.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test_outcome_organization.py')
          text = p.read_text()
          text = text.replace(
              'self.assertTrue(any("Do not modify candidate artifacts" == item for item in manager["acceptance"]))',
              'self.assertTrue(any("Do not modify candidate artifacts" in item for item in manager["acceptance"]))',
          )
          p.write_text(text)
          PY
      - name: Verify outcome organization and loop
        run: python3 -m unittest tests.test_outcome_organization tests.test_outcome_loop -v
      - name: Verify fabric validator
        run: python3 skills/autonomy-suite/orchestration/luna-execution-fabric/scripts/validate_fabric.py --self-test
      - name: Refresh distribution manifest
        run: python3 scripts/distribution.py write-manifest
      - name: Commit verified evaluator organization
        run: |
          rm scripts/apply_outcome_evaluator_organization.py
          rm .github/workflows/apply-outcome-evaluator-organization.yml
          git config user.name "company-os-evaluator-org-bot"
          git config user.email "company-os-evaluator-org-bot@users.noreply.github.com"
          git add skills tests distribution-manifest.json scripts .github/workflows
          git commit -m "feat(company-os): compile independent evaluator phases"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin codex/company-os-outcome-control-plane
            git rebase origin/codex/company-os-outcome-control-plane
            if git push origin HEAD:codex/company-os-outcome-control-plane; then
              exit 0
            fi
          done
          exit 1
