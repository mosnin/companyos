<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Context-isolated delegation in Company OS</title>
  <desc id="desc">A master manager delegates bounded outcomes to three isolated managers. Each manager leads a small Luna worker team and reports accepted evidence back to the master.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="100%"><stop stop-color="#352980"/><stop offset="0.55" stop-color="#101225"/><stop offset="1" stop-color="#061b19"/></radialGradient>
    <linearGradient id="capsule" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2a225b"/><stop offset="1" stop-color="#101323"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#fff8e7" opacity="0.035"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity="0.45"/></filter>
    <marker id="gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#f1d38b"/></marker>
    <marker id="green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78e6c2"/></marker>
    <style>.eyebrow{font:700 18px Arial,sans-serif;letter-spacing:4px;fill:#78e6c2}.title{font:700 48px Arial,sans-serif;fill:#fff8e7}.subtitle{font:400 21px Arial,sans-serif;fill:#c9c5d6}.h{font:700 25px Arial,sans-serif;fill:#fff8e7}.body{font:400 18px Arial,sans-serif;fill:#d7d4df}.micro{font:700 15px Arial,sans-serif;letter-spacing:1.2px;fill:#78e6c2}</style>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/><rect width="1600" height="900" rx="36" fill="url(#grid)"/>
  <text x="82" y="78" class="eyebrow">CONTEXT IS A DESIGN MATERIAL</text>
  <text x="82" y="136" class="title">Separate rooms. Shared truth.</text>
  <text x="82" y="177" class="subtitle">Every team receives only the context it needs—and returns evidence instead of another giant conversation.</text>

  <circle cx="800" cy="310" r="114" fill="#4a34cc" stroke="#b3a8ff" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="800" cy="310" r="88" fill="none" stroke="#fff8e7" stroke-opacity="0.22" stroke-dasharray="5 10"/>
  <text x="800" y="298" text-anchor="middle" class="h">MASTER</text><text x="800" y="330" text-anchor="middle" class="h">MANAGER</text><text x="800" y="361" text-anchor="middle" class="micro">PLAN + INTEGRATION</text>

  <path d="M732 398C650 456 520 457 398 503M800 424V503M868 398C950 456 1080 457 1202 503" fill="none" stroke="#f1d38b" stroke-width="4" marker-end="url(#gold)"/>
  <text x="535" y="446" style="font:700 16px Arial,sans-serif;fill:#f1d38b">compact charter</text><text x="825" y="469" style="font:700 16px Arial,sans-serif;fill:#f1d38b">compact charter</text><text x="1045" y="446" style="font:700 16px Arial,sans-serif;fill:#f1d38b">compact charter</text>

  <g filter="url(#shadow)">
    <rect x="100" y="515" width="420" height="300" rx="58" fill="url(#capsule)" stroke="#7465db" stroke-width="2"/>
    <rect x="590" y="515" width="420" height="300" rx="58" fill="url(#capsule)" stroke="#7465db" stroke-width="2"/>
    <rect x="1080" y="515" width="420" height="300" rx="58" fill="url(#capsule)" stroke="#7465db" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text x="310" y="566" class="micro">MANAGER CONTEXT A</text><text x="310" y="603" class="h">Product experience</text><text x="310" y="633" class="body">Owns one outcome and one scorecard</text>
    <text x="800" y="566" class="micro">MANAGER CONTEXT B</text><text x="800" y="603" class="h">Engineering release</text><text x="800" y="633" class="body">Owns interfaces, build, and proof</text>
    <text x="1290" y="566" class="micro">MANAGER CONTEXT C</text><text x="1290" y="603" class="h">Go-to-market</text><text x="1290" y="633" class="body">Owns audience, story, and launch</text>
  </g>

  <g fill="#0b564b" stroke="#78e6c2" stroke-width="2">
    <circle cx="210" cy="710" r="42"/><circle cx="310" cy="710" r="42"/><circle cx="410" cy="710" r="42"/>
    <circle cx="700" cy="710" r="42"/><circle cx="800" cy="710" r="42"/><circle cx="900" cy="710" r="42"/>
    <circle cx="1190" cy="710" r="42"/><circle cx="1290" cy="710" r="42"/><circle cx="1390" cy="710" r="42"/>
  </g>
  <g text-anchor="middle" style="font:700 16px Arial,sans-serif;fill:#fff8e7"><text x="210" y="716">LUNA</text><text x="310" y="716">LUNA</text><text x="410" y="716">LUNA</text><text x="700" y="716">LUNA</text><text x="800" y="716">LUNA</text><text x="900" y="716">LUNA</text><text x="1190" y="716">LUNA</text><text x="1290" y="716">LUNA</text><text x="1390" y="716">LUNA</text></g>
  <g class="body" text-anchor="middle"><text x="310" y="782">Skills + bounded task packets</text><text x="800" y="782">Skills + bounded task packets</text><text x="1290" y="782">Skills + bounded task packets</text></g>

  <path d="M400 515C522 450 654 449 735 392M800 515V432M1200 515C1078 450 946 449 865 392" fill="none" stroke="#78e6c2" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#green)"/>
  <text x="161" y="862" style="font:700 18px Arial,sans-serif;fill:#78e6c2">↑ accepted evidence</text><text x="647" y="862" style="font:700 18px Arial,sans-serif;fill:#78e6c2">↑ decisions, not context dumps</text><text x="1165" y="862" style="font:700 18px Arial,sans-serif;fill:#78e6c2">↑ exceptions + outcomes</text>
</svg>
